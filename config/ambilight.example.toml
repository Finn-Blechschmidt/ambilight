# Example configuration. Copy to ambilight.local.toml and adjust.
# Values marked "unverified" are confirmed with the hardware in milestone M2.

[layout]
# LEDs per segment in strip order: start at the bottom centre right of a gap of one LED,
# bottom (towards the right), right side (up), top (towards the left), left side (down), bottom (to the gap).
bottom_right = 17
right = 20
top = 35
left = 20
bottom_left = 17
gap = 1
direction = "ccw"   # unverified: "ccw" = bottom -> right -> top -> left as seen from the front, "cw" = mirrored

[regions]
frame_width = 720   # NTSC, see docs/decisions.md ADR-004
frame_height = 480
crop_left = 8       # overscan / blanking border that is ignored
crop_right = 8
crop_top = 8
crop_bottom = 8
depth_x = 64        # how far a side region reaches into the picture, pixels
depth_y = 48        # same for top and bottom regions

[leds]
gpio_pin = 18          # pin 12, PWM0
color_order = "GRB"    # unverified
max_current_ma = 2000  # current budget for the whole strip, enforced in software
ma_per_channel = 20
idle_ma_per_led = 1

[color]
gamma = 2.2
brightness = 1.0

[smoothing]
tau_slow_s = 0.30     # small changes (noise, flicker) are smoothed with this time constant
tau_fast_s = 0.04     # large changes pass with this one
delta_low = 6         # change below this (0..255 steps) counts as noise
delta_high = 40       # change above this counts as a real change
cut_threshold = 70    # mean change over all LEDs above this is a scene cut: jump immediately

[signal]
no_signal_frames = 10  # frames of the converter's test pattern before the LEDs fade out
frozen_frames = 60     # byte-identical frames in a row (stalled capture) before the LEDs fade out
lost_timeout_s = 1.0   # no frame at all for this long
fade_out_s = 0.5
fade_in_s = 0.3

[capture]
device = "/dev/video0"
input = 0
standard = "ntsc-m"      # converter switch and grabber standard must both be NTSC (docs/decisions.md ADR-004)
buffers = 4
restart_delay_s = 1.0    # pause before the capture process is restarted
stall_timeout_s = 3.0    # no frame for this long: restart the capture process

[metrics]
interval_s = 10          # how often a summary is logged
json_path = ""           # if set, the latest summary is also written there as JSON
